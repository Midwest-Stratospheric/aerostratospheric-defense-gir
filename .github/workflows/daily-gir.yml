name: Daily GIR open-tier ingest

on:
  schedule:
    # 06:00 and 18:00 UTC
    - cron: "0 6 * * *"
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run comprehensive ingest + commit
        run: |
          chmod +x scripts/daily_gir_automation.sh scripts/*.py
          bash scripts/daily_gir_automation.sh

      - name: Push updates
        run: |
          git config user.name "GIR Daily Automation"
          git config user.email "gir-automation@aerostratospheric.local"
          git pull --rebase origin main || true
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "chore(gir): daily open-tier data refresh $(date -u +%Y%m%dT%H%M%SZ)" || true
          fi
          git push origin HEAD:main || git push origin HEAD:main --force-with-lease || true
