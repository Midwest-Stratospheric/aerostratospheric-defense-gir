name: Daily GIR open-tier ingest

on:
  schedule:
    # 06:00 and 18:00 UTC
    - cron: "0 6 * * *"
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # Map secrets to env so the email step can be skipped cleanly when unset
      SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run comprehensive ingest + commit
        run: |
          chmod +x scripts/daily_gir_automation.sh scripts/*.py
          bash scripts/daily_gir_automation.sh

      - name: Push updates
        run: |
          git config user.name "GIR Daily Automation"
          git config user.email "gir-automation@aerostratospheric.local"
          git pull --rebase origin main || true
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "chore(gir): daily open-tier data refresh $(date -u +%Y%m%dT%H%M%SZ)" || true
          fi
          git push origin HEAD:main || git push origin HEAD:main --force-with-lease || true

      - name: Prepare email body
        id: mail
        run: |
          DATE_UTC=$(date -u +%Y-%m-%d)
          REPORT="reports/daily/${DATE_UTC}-gir-exec.md"
          if [ ! -f "$REPORT" ]; then
            REPORT="reports/latest.md"
          fi
          echo "report_path=$REPORT" >> "$GITHUB_OUTPUT"
          echo "date_utc=$DATE_UTC" >> "$GITHUB_OUTPUT"
          {
            echo "Aerostratospheric Defense GIR — daily open-tier executive summary"
            echo "Generated (UTC): $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "Report file: $REPORT"
            echo "GitHub: https://github.com/Midwest-Stratospheric/aerostratospheric-defense-gir/blob/main/$REPORT"
            echo ""
            echo "────────────────────────────────────────"
            echo ""
            cat "$REPORT" 2>/dev/null || echo "(report file not found on this run)"
            echo ""
            echo "────────────────────────────────────────"
            echo "Open-tier public data only. Research screening — not an official product."
            echo "Aerostratospheric Defense GIR · launchcontrol@midwestsds.com"
          } > /tmp/gir-email-body.txt

      - name: Email daily executive summary
        if: env.SMTP_PASSWORD != ''
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.hostinger.com
          server_port: 465
          secure: true
          username: ${{ env.SMTP_USERNAME }}
          password: ${{ env.SMTP_PASSWORD }}
          subject: GIR Daily Exec — ${{ steps.mail.outputs.date_utc }}
          to: launchcontrol@midwestsds.com
          from: Aerostratospheric GIR <launchcontrol@midwestsds.com>
          reply_to: launchcontrol@midwestsds.com
          body: file:///tmp/gir-email-body.txt
          content_type: text/plain
          ignore_cert: false
