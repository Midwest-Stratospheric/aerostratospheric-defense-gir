name: Daily Hugging Face sync (GIR)

# Scheduled runs removed: this repo has no HF_TOKEN secret (confirmed empty in
# Actions logs). Mirror now runs from Unified-Open-Global-Weather workflow
# "Daily Hugging Face sync (GIR via UOGW secrets)".
# Re-enable the cron after adding repository secret HF_TOKEN here.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gir-huggingface-daily
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Sync GIR packages to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_REPO: aerostratospheric/gir
          HF_USER: aerostratospheric
        run: |
          chmod +x scripts/sync_to_huggingface.sh
          bash scripts/sync_to_huggingface.sh
