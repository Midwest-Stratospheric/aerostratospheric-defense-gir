name: Weekly GIR Release

# One pinned snapshot per ISO week: tag + Release with data/charts zip + email notice.

on:
  schedule:
    - cron: "0 12 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gir-weekly-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute tag and package assets
        id: meta
        run: |
          set -euo pipefail
          WEEK=$(date -u +%G-W%V)
          TAG="gir-${WEEK}"
          DATE_UTC=$(date -u +%Y-%m-%d)
          PKG="gir-release-${WEEK}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "week=$WEEK" >> "$GITHUB_OUTPUT"
          echo "date_utc=$DATE_UTC" >> "$GITHUB_OUTPUT"
          echo "pkg=$PKG" >> "$GITHUB_OUTPUT"

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

          mkdir -p "/tmp/${PKG}/reports" "/tmp/${PKG}/charts" "/tmp/${PKG}/data" "/tmp/${PKG}/docs"

          # Executive reports
          cp -a reports/. "/tmp/${PKG}/reports/" 2>/dev/null || true

          # Graphs / charts
          if [ -d docs/charts ]; then cp -a docs/charts/. "/tmp/${PKG}/charts/"; fi
          if [ -f docs/GRAPHS.md ]; then cp docs/GRAPHS.md "/tmp/${PKG}/docs/"; fi
          if [ -f docs/DATA_PACKAGES.md ]; then cp docs/DATA_PACKAGES.md "/tmp/${PKG}/docs/"; fi

          # Core open-tier data snapshots (latest pointers + key trees)
          for d in manifests status anomalies events imagery_index defense_open flight_logs quality temporal; do
            if [ -d "data/$d" ]; then
              mkdir -p "/tmp/${PKG}/data/$d"
              cp -a "data/$d/." "/tmp/${PKG}/data/$d/" 2>/dev/null || true
            fi
          done

          # Manifest of package contents
          {
            echo "Aerostratospheric Defense GIR weekly release package"
            echo "tag: ${TAG}"
            echo "week: ${WEEK}"
            echo "generated_utc: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "commit: $(git rev-parse HEAD)"
            echo ""
            echo "contents:"
            (cd "/tmp/${PKG}" && find . -type f | sort)
          } > "/tmp/${PKG}/PACKAGE_CONTENTS.txt"

          (cd /tmp && zip -r -q "${PKG}.zip" "${PKG}")
          ls -lh "/tmp/${PKG}.zip"
          echo "zip_path=/tmp/${PKG}.zip" >> "$GITHUB_OUTPUT"

          {
            echo "## Aerostratospheric Defense GIR — weekly snapshot ${WEEK}"
            echo ""
            echo "**Tag:** \"${TAG}\"  "
            echo "**Date (UTC):** ${DATE_UTC}  "
            echo "**Commit:** $(git rev-parse --short HEAD)"
            echo ""
            echo "Attached: **${PKG}.zip** — executive reports, charts/graphs, and open-tier data snapshots (manifest, status, anomalies, events, imagery index, defense-open, etc.)."
            echo ""
            echo "Open-tier public data only. Research screening — not an official product."
            echo ""
            echo "### Online pointers"
            echo "- [Latest exec summary](https://github.com/Midwest-Stratospheric/aerostratospheric-defense-gir/blob/main/reports/latest.md)"
            echo "- [Charts](https://github.com/Midwest-Stratospheric/aerostratospheric-defense-gir/tree/main/docs/charts)"
            echo "- [Manifest](https://github.com/Midwest-Stratospheric/aerostratospheric-defense-gir/blob/main/data/manifests/manifest_latest.json)"
            echo ""
            echo "### Latest executive summary (excerpt)"
            echo ""
            if [ -f reports/latest.md ]; then head -n 80 reports/latest.md; else echo "_(no reports/latest.md)_"; fi
            echo ""
            echo "---"
            echo "*Automated weekly release · Aerostratospheric Defense GIR*"
          } > /tmp/release-notes.md

      - name: Create GitHub Release with assets
        id: release
        if: steps.meta.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: GIR weekly ${{ steps.meta.outputs.week }}
          body_path: /tmp/release-notes.md
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            /tmp/${{ steps.meta.outputs.pkg }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare release email
        if: steps.meta.outputs.exists == 'false'
        run: |
          WEEK="${{ steps.meta.outputs.week }}"
          TAG="${{ steps.meta.outputs.tag }}"
          PKG="${{ steps.meta.outputs.pkg }}"
          {
            echo "Aerostratospheric Defense GIR — weekly release published"
            echo ""
            echo "Tag:    ${TAG}"
            echo "Week:   ${WEEK}"
            echo "Time:   $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo ""
            echo "Release page:"
            echo "https://github.com/Midwest-Stratospheric/aerostratospheric-defense-gir/releases/tag/${TAG}"
            echo ""
            echo "Asset: ${PKG}.zip"
            echo "  Includes: reports, charts/graphs, open-tier data snapshots"
            echo ""
            echo "Latest summary:"
            echo "https://github.com/Midwest-Stratospheric/aerostratospheric-defense-gir/blob/main/reports/latest.md"
            echo ""
            echo "────────────────────────────────────────"
            echo "Open-tier public data only. Research screening — not an official product."
            echo "Aerostratospheric Defense GIR · launchcontrol@midwestsds.com"
          } > /tmp/gir-release-email.txt

      - name: Email release notification
        if: steps.meta.outputs.exists == 'false' && env.SMTP_PASSWORD != ''
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.hostinger.com
          server_port: 465
          secure: true
          username: ${{ env.SMTP_USERNAME }}
          password: ${{ env.SMTP_PASSWORD }}
          subject: GIR Release ${{ steps.meta.outputs.tag }} published
          to: launchcontrol@midwestsds.com
          from: Aerostratospheric GIR <launchcontrol@midwestsds.com>
          reply_to: launchcontrol@midwestsds.com
          body: file:///tmp/gir-release-email.txt
          content_type: text/plain

      - name: Skip notice
        if: steps.meta.outputs.exists == 'true'
        run: echo "Release ${{ steps.meta.outputs.tag }} already exists; no action."
