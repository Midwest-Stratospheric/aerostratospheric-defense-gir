name: Weekly GIR Release

# Practical cadence: one pinned, citable snapshot per ISO week.
# Creates tag gir-YYYY-Www and a GitHub Release from main.

on:
  schedule:
    # Monday 12:00 UTC (after morning ingest / weekend data)
    - cron: "0 12 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gir-weekly-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute tag and notes
        id: meta
        run: |
          set -euo pipefail
          WEEK=$(date -u +%G-W%V)
          TAG="gir-${WEEK}"
          DATE_UTC=$(date -u +%Y-%m-%d)
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "week=$WEEK" >> "$GITHUB_OUTPUT"
          echo "date_utc=$DATE_UTC" >> "$GITHUB_OUTPUT"

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Tag $TAG already exists — skipping create."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

          {
            echo "## Aerostratospheric Defense GIR — weekly snapshot ${WEEK}"
            echo ""
            echo "**Tag:** \"${TAG}\"  "
            echo "**Date (UTC):** ${DATE_UTC}  "
            echo "**Commit:** $(git rev-parse --short HEAD)"
            echo ""
            echo "Open-tier public data only. Research screening — not an official product."
            echo ""
            echo "### Pointers"
            echo "- Latest executive summary: [reports/latest.md](https://github.com/Midwest-Stratospheric/aerostratospheric-defense-gir/blob/main/reports/latest.md)"
            echo "- Daily archive: [reports/daily/](https://github.com/Midwest-Stratospheric/aerostratospheric-defense-gir/tree/main/reports/daily)"
            echo "- Manifest: [data/manifests/manifest_latest.json](https://github.com/Midwest-Stratospheric/aerostratospheric-defense-gir/blob/main/data/manifests/manifest_latest.json)"
            echo ""
            echo "### Latest executive summary (excerpt)"
            echo ""
            if [ -f reports/latest.md ]; then
              # Keep release body bounded
              head -n 80 reports/latest.md
            else
              echo "_(reports/latest.md not present on this commit)_"
            fi
            echo ""
            echo "---"
            echo "*Automated weekly release · Aerostratospheric Defense GIR*"
          } > /tmp/release-notes.md

      - name: Create GitHub Release
        if: steps.meta.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: GIR weekly ${{ steps.meta.outputs.week }}
          body_path: /tmp/release-notes.md
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Skip notice
        if: steps.meta.outputs.exists == 'true'
        run: echo "Release ${{ steps.meta.outputs.tag }} already exists; no action."
